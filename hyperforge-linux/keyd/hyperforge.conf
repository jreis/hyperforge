# HyperForge for Linux — keyd alternative
# After install.sh: sudo cp ~/.local/share/hyperforge-linux/keyd-hyperforge.conf /etc/keyd/hyperforge.conf
#                  sudo systemctl enable --now keyd && sudo keyd reload
#
# Parity target: current macOS HyperForge (window pad + thirds/2-thirds/almost-max +
# snippet picker + clipboard history + Space nav subset).
# Typed hotstrings (@@, ,sig) are kanata-only (sequence-always-on); keyd stays picker/chord.
# Caps tap = Esc · Caps hold = hyper layer
# Space tap = space · Space hold = nav layer

[ids]
*

[main]
capslock = overload(hyper, esc)
space = overload(nav, space)

[hyper]
left = command(HF_BIN/hyperforge-action win-left)
right = command(HF_BIN/hyperforge-action win-right)
up = command(HF_BIN/hyperforge-action win-top)
down = command(HF_BIN/hyperforge-action win-bottom)
enter = command(HF_BIN/hyperforge-action win-max)
x = command(HF_BIN/hyperforge-action win-close)
z = command(HF_BIN/hyperforge-action win-undo)
c = command(HF_BIN/hyperforge-action win-center)
a = command(HF_BIN/hyperforge-action always-on-top)
b = command(HF_BIN/hyperforge-action win-min)
t = command(HF_BIN/hyperforge-action term)
f = command(HF_BIN/hyperforge-action files)
1 = command(HF_BIN/hyperforge-action browser)
2 = command(HF_BIN/hyperforge-action editor)
6 = command(HF_BIN/hyperforge-action win-tile)
esc = command(HF_BIN/hyperforge-action lock)
7 = command(HF_BIN/hyperforge-action win-tl)
8 = command(HF_BIN/hyperforge-action win-tr)
9 = command(HF_BIN/hyperforge-action win-bl)
0 = command(HF_BIN/hyperforge-action win-br)
. = command(HF_BIN/hyperforge-action date)
g = command(HF_BIN/hyperforge-action google-clip)
m = command(HF_BIN/hyperforge-action win-next)
n = command(HF_BIN/hyperforge-action region-pin)
q = command(HF_BIN/hyperforge-action region-ocr)
w = command(HF_BIN/hyperforge-action warp)
k = command(HF_BIN/hyperforge-action keepalive)
v = command(HF_BIN/hyperforge-action paste-menu)
/ = command(HF_BIN/hyperforge-action cheat-sheet)
apostrophe = command(HF_BIN/hyperforge-action command-bar)
[ = command(HF_BIN/hyperforge-action win-prev)
] = command(HF_BIN/hyperforge-action win-next)
u = command(HF_BIN/hyperforge-action open-url)
e = command(HF_BIN/hyperforge-action plain-paste)
# Thirds / two-thirds / almost-max (macOS parity). No Shift-variant disambiguation
# here (see hyperforge.kbd comment) — 2/3 and almost-max get their own keys.
- = command(HF_BIN/hyperforge-action win-third-l)
= = command(HF_BIN/hyperforge-action win-third-r)
\ = command(HF_BIN/hyperforge-action win-third-c)
i = command(HF_BIN/hyperforge-action win-2third-l)
o = command(HF_BIN/hyperforge-action win-2third-r)
y = command(HF_BIN/hyperforge-action win-almost-max)
# Snippets (Hyper+,) and clipboard history (Hyper+P)
, = command(HF_BIN/hyperforge-action snippet-pick)
p = command(HF_BIN/hyperforge-action clip-show)
j = command(HF_BIN/hyperforge-action script-pick)
l = command(HF_BIN/hyperforge-action workspace-pick)
# Numpad spatial pad (macOS layout)
kp7 = command(HF_BIN/hyperforge-action win-tl)
kp8 = command(HF_BIN/hyperforge-action win-top)
kp9 = command(HF_BIN/hyperforge-action win-tr)
kp4 = command(HF_BIN/hyperforge-action win-left)
kp5 = command(HF_BIN/hyperforge-action win-max)
kp6 = command(HF_BIN/hyperforge-action win-right)
kp1 = command(HF_BIN/hyperforge-action win-bl)
kp2 = command(HF_BIN/hyperforge-action win-bottom)
kp3 = command(HF_BIN/hyperforge-action win-br)
kp0 = command(HF_BIN/hyperforge-action win-center)

[nav]
h = left
j = down
k = up
l = right
b = command(HF_BIN/hyperforge-nav word-back)
w = command(HF_BIN/hyperforge-nav word-forward)
y = command(HF_BIN/hyperforge-nav copy)
p = command(HF_BIN/hyperforge-nav paste)
c = command(HF_BIN/hyperforge-nav cut)
u = command(HF_BIN/hyperforge-nav undo)
r = command(HF_BIN/hyperforge-nav redo)
x = command(HF_BIN/hyperforge-nav kill-eol)
s = command(HF_BIN/hyperforge-nav save)
f = command(HF_BIN/hyperforge-nav find)
a = command(HF_BIN/hyperforge-nav select-line)
5 = home
6 = end
home = home
end = end
, = pageup
. = pagedown
enter = enter
q = esc
