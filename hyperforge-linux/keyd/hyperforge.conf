# HyperForge for Linux — keyd alternative
# After install.sh: sudo cp ~/.local/share/hyperforge-linux/keyd-hyperforge.conf /etc/keyd/hyperforge.conf
#                  sudo systemctl enable --now keyd && sudo keyd reload
#
# Caps tap = Esc · Caps hold = hyper layer
# Space tap = space · Space hold = nav layer

[ids]
*

[main]
capslock = overload(hyper, esc)
space = overload(nav, space)

[hyper]
left = command(HF_BIN/hyperforge-action win-left)
right = command(HF_BIN/hyperforge-action win-right)
up = command(HF_BIN/hyperforge-action win-top)
down = command(HF_BIN/hyperforge-action win-bottom)
enter = command(HF_BIN/hyperforge-action win-max)
x = command(HF_BIN/hyperforge-action win-close)
z = command(HF_BIN/hyperforge-action win-undo)
c = command(HF_BIN/hyperforge-action win-center)
t = command(HF_BIN/hyperforge-action term)
f = command(HF_BIN/hyperforge-action files)
1 = command(HF_BIN/hyperforge-action browser)
2 = command(HF_BIN/hyperforge-action editor)
esc = command(HF_BIN/hyperforge-action lock)
7 = command(HF_BIN/hyperforge-action win-tl)
8 = command(HF_BIN/hyperforge-action win-tr)
9 = command(HF_BIN/hyperforge-action win-bl)
0 = command(HF_BIN/hyperforge-action win-br)
. = command(HF_BIN/hyperforge-action date)
g = command(HF_BIN/hyperforge-action google-clip)
m = command(HF_BIN/hyperforge-action hostname)

[nav]
h = left
j = down
k = up
l = right
b = C-left
w = C-right
0 = home
4 = end
