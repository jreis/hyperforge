# hyperforge-snippet config — copy to ~/.config/hyperforge-linux/snippets.conf
# trigger=expansion — the key is both the picker name and the typed hotstring.
# Triggers with punctuation expand as you type (macOS @@ / ,sig parity):
#   @@     you@example.com
#   ,sig   sign-off
#   ,date  today's date
# All-letter names (email, host) stay picker-only so they don't fire mid-word.
# After editing this file: hyperforge-snippet --sync
#
# Tokens (macOS SnippetStore parity):
#   {{date}}  {{date:yyyy-MM-dd}}  {{clipboard}}  {{hostname}}  {{uuid}}  {{lan-ip}}
# \n expands to a real newline. Hyper+, still opens the picker.

@@=you@example.com
,sig=Thanks,\nYour Name
,date={{date}}
,v={{clipboard}}
,host={{hostname}}
,uuid={{uuid}}
,ip={{lan-ip}}

# Default {{date}} format when a snippet doesn't specify one (mac-style tokens,
# translated to `date` format internally — see hyperforge-snippet).
date_format=yyyy-MM-dd
