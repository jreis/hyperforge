; HyperForge for Windows — copy to config.ini and edit.
; config.ini is gitignored (keep personal paths out of git).

[general]
; Caps → Hyper (#^!+). Set 0 to leave Caps alone (e.g. if you use PowerToys).
caps_to_hyper=1
; Bare Caps tap (no other key) sends Escape, same as macOS Karabiner to_if_alone.
; Set 0 to make a tap do nothing.
caps_tap_escape=1
; Accelerated mouse wheel. Set 0 to use OS scrolling only.
wheel_accel=1
; Mouse Back button minimizes the active window. Off so Back still works in browsers.
; Hyper+B minimizes either way.
xbutton1_minimize=0
; Keep-alive mouse nudge (Win+J / Hyper+K). OFF by default: it defeats idle lock and
; presence, which most employers' policies forbid. Ask IT before setting 1.
keepalive_enabled=0
; Interval minutes (only used when keepalive_enabled=1).
keepalive_minutes=5
; Show small toasts for toggles / copies
toasts=1
; Verbose monitor-move diagnostics in %TEMP%\hyperforge-move-diag.log
move_diag=0

[mute]
; Comma-separated process names where Hyper chords (and Caps→Hyper) are off.
; mstsc.exe / msrdc.exe always muted. Defaults also mute a few emulators.
processes=
; Extra processes appended to defaults
extra=
; Also disable Caps→Hyper while muted apps are focused
caps_too=1
; Win+Esc pause duration (seconds)
pause_seconds=30

[paths]
; Leave blank to use common install locations / PATH.
; Optional: LazyVim/Neovim executable. If blank, HyperForge auto-detects nvim and
; uses it before Notepad when opening text files (config/favorites/script fallback).
lazyvim=
notepad=
; Blank = C:\Program Files\Microsoft VS Code\Code.exe, then the per-user install
; %LOCALAPPDATA%\Programs\Microsoft VS Code\Code.exe.
vscode=
chrome=C:\Program Files\Google\Chrome\Application\chrome.exe
; Optional. Leave blank. A value opens Chrome with --remote-debugging-port (local debug access).
chrome_debug_port=
; Blank = C:\Program Files\Microsoft Office\root\Office16\OUTLOOK.EXE
outlook=
teams=
; Windows Terminal
terminal=wt
; Shell used when Hyper+N launches Neovim through terminal (default: powershell.exe)
terminal_shell=powershell.exe
; Optional: Agent Ransack / file search
search=
; Optional: open this script or notes in editor (Hyper+H)
edit_target=
; Favorites INI for quick menu (optional)
favorites_ini=
; Folder of .txt snippets for quick menu (optional)
quickref_dir=
; Folder of Hyper+J scripts (*.ahk). Blank = scripts\ next to HyperForge.ahk; example
; scripts are seeded there on first run. Optional PowerShell "shortcuts" (*.ps1) for
; HF_RunShortcut / Toggle Focus always live in shortcuts\ next to HyperForge.ahk.
scripts_dir=

[apps]
; App chords (Hyper+N/V/C/T/E/4) use the [paths] entries above.
; Optional: command run in cmd.exe before launching Hyper+N editor. Use this to
; import toolchain PATH/env (example: call "%USERPROFILE%\dev\env.cmd").
editor_env_bootstrap=
; Hyper+5 opens this comma-separated localhost/dev URL menu (scheme optional).
local_urls=http://localhost:3000, http://localhost:5173, http://localhost:8080
; Optional URL for Hyper+S (leave blank if unused)
hyper_s_url=

[snippets]
; hotstring=expansion — use \n for newlines. Tokens: {{date}}, {{date:MM/dd/yyyy}},
; {{clipboard}}, {{hostname}}, {{uuid}}, {{lan-ip}} (matches macOS HyperForge snippets).
,sig=Thanks,\nYour Name
,v={{clipboard}}
@@=you@example.com
tj=Thanks,\nYour Name
,date={{date}}
,host={{hostname}}
,uuid={{uuid}}
; Default {{date}} format when a snippet doesn't specify one (AHK FormatTime tokens).
date_format=yyyy-MM-dd

[clipboard]
; Hyper+P clipboard history. Off by default: it records everything you copy.
; When on, copies marked "don't record" by password managers are skipped.
enabled=0
; 0 = memory only (default). 1 = save to %LOCALAPPDATA%\HyperForge\clipboard-history.dat
; (base64, NOT encrypted). Never exported by Tray → Export.
persist=0
; Unpinned entries kept in Hyper+P clipboard history (pinned entries never evict).
max_items=20

[network]
; Whois / reverse DNS are generic; leave as-is unless you have a custom endpoint.
arin_whois=https://whois.arin.net/ui/query.do
